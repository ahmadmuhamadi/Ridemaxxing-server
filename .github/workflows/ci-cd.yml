name: backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. CONTINUOUS INTEGRATION: Lint & Test against real Postgres + Redis
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ridemaxxing
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Run Tests (with Race Detector)
        env:
          DB_URL: postgres://testuser:testpassword@localhost:5432/ridemaxxing?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
        run: go test -v -race ./...
